name: CI
on:
  push:
  pull_request:

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: npm ci
      - run: npm run check
      - run: npm run check:pii
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      # --locked everywhere: the release tree must build from the
      # committed lockfile without implicit updates.
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  intel-macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
          components: rustfmt, clippy
      - run: npm ci
      - run: cargo check --workspace --locked --target x86_64-apple-darwin
      - run: cargo test --workspace --locked --target x86_64-apple-darwin
      # The Tauri CLI owns its inner cargo invocation and cannot take
      # --locked, so lock enforcement is explicit: compile the exact
      # release binary locked first, then bundle, then prove neither
      # step mutated the committed lockfiles.
      - run: cargo build --locked --release --target x86_64-apple-darwin -p usage-ai-app
      - run: npm run tauri build -- --target x86_64-apple-darwin
        env:
          CARGO_NET_OFFLINE: 'true'
      - name: Verify lockfiles untouched by the release build
        run: |
          git status --porcelain -- Cargo.lock package-lock.json | tee lockcheck.txt
          test ! -s lockcheck.txt
      - name: Verify Intel executable and bundles
        run: |
          executable="$(find target/x86_64-apple-darwin/release/bundle/macos -type f -perm -111 -maxdepth 4 | head -1)"
          file "$executable" | tee architecture.txt
          grep -q 'x86_64' architecture.txt
          find target/x86_64-apple-darwin/release/bundle -name '*.app' -o -name '*.dmg'

