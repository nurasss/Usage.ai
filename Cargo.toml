[workspace]
resolver = "2"
members = ["crates/usage-core", "crates/usage-host", "crates/usage-providers", "crates/usage-runtime", "crates/usage-storage", "src-tauri"]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "MIT"
authors = ["Usage.ai"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
rust_decimal = { version = "1", features = ["serde-with-str", "serde-with-arbitrary-precision"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
